  6-1-1709)'
jurisdiction: US-CO
version: 0.1.0
lifecycle: enacted
as_of: '2026-10-26'
sources:
- id: co-sb26-189-signed
  title: Senate Bill 26-189, signed act (approved May 14, 2026)
  publisher: Colorado General Assembly
  primary: true
  retrieved_on: '2026-10-26'
