provisions:
- id: co-6-1-1701-1
  citation: C.R.S. § 6-1-1701(1)
  source: co-sb26-189-signed
  location: Signed act, p. 2
  effective_from: '2027-01-01'
  text: '(1) "ADVERSE OUTCOME" MEANS: (a) A DECISION THAT DENIES, TERMINATES, REVOKES, OR MATERIALLY REDUCES OR
    RESTRICTS A CONSUMER''S ACCESS TO, ELIGIBILITY FOR, SELECTION FOR, COMPENSATION FOR, OR THE PROVISION OF AN
    OPPORTUNITY OR SERVICE; OR (b) A DECISION THAT RESULTS IN MATERIALLY LESS FAVORABLE DIFFERENTIATED PRICE, COST,
    COMPENSATION, OR OTHER MATERIAL TERMS THAT ARE REASONABLY LIKELY TO MATERIALLY LIMIT, DELAY, OR EFFECTIVELY
    DENY, OR OTHERWISE FUNDAMENTALLY ALTER, A CONSUMER''S ACCESS TO, ELIGIBILITY FOR, SELECTION FOR, COMPENSATION
    FOR, OR THE PROVISION OF AN OPPORTUNITY OR SERVICE COMPARED TO TERMS OFFERED TO SIMILARLY SITUATED CONSUMERS.
    IF A DECISION OUTCOME IMPOSES MATERIALLY LESS FAVORABLE DIFFERENTIATED PRICING OR TERMS, THE DECISION OUTCOME
    MATERIALLY INFLUENCES PRICE, COST SHARING, COMPENSATION, OR MATERIAL TERMS.'
  summary: An adverse outcome is a decision that denies, terminates, revokes or materially reduces or restricts
    a consumer's access to, eligibility for, selection for, compensation for or provision of an opportunity or service,
    or that gives materially less favorable price, compensation or other terms than similarly situated consumers
    receive, in a way reasonably likely to limit, delay, deny or fundamentally alter that access.
- id: co-6-1-1701-2-a
  citation: C.R.S. § 6-1-1701(2)(a)
  source: co-sb26-189-signed
  location: Signed act, p. 2
  effective_from: '2027-01-01'
  text: (2) (a) "AUTOMATED DECISION-MAKING TECHNOLOGY" OR "ADMT" MEANS A TECHNOLOGY THAT PROCESSES PERSONAL DATA
    AND USES COMPUTATION TO GENERATE OUTPUT, INCLUDING PREDICTIONS, RECOMMENDATIONS, CLASSIFICATIONS, RANKINGS,
    SCORES, OR OTHER INFORMATION THAT IS USED TO MAKE, GUIDE, OR ASSIST A DECISION, JUDGMENT, OR DETERMINATION CONCERNING
    AN INDIVIDUAL.
  summary: ADMT is technology that processes personal data and uses computation to generate output, such as predictions,
    recommendations, classifications, rankings or scores, used to make, guide or assist a decision, judgment or
    determination about an individual.
- id: co-6-1-1701-2-b
  citation: C.R.S. § 6-1-1701(2)(b)
  source: co-sb26-189-signed
  location: Signed act, pp. 2-4
  effective_from: '2027-01-01'
  text: '(b) "AUTOMATED DECISION-MAKING TECHNOLOGY" OR "ADMT" DOES NOT INCLUDE: (I) THE FOLLOWING TECHNOLOGIES:
    (A) ANTI-MALWARE; (B) ANTI-VIRUS; (C) CALCULATORS; (D) DATABASES; (E) DATA STORAGE; (F) FIREWALLS; (G) INTERNET
    DOMAIN REGISTRATION; (H) INTERNET WEBSITE LOADING; (I) NETWORKING; (J) SPAM- AND ROBOCALL-FILTERING; (K) SPELL-CHECKING;
    (L) SPREADSHEETS THAT REQUIRE HUMAN ANALYSIS AND DO NOT USE MACHINE LEARNING, FOUNDATION MODELS, OR LARGE LANGUAGE
    MODELS; (M) WEB CACHING; OR (N) WEB HOSTING; (II) A TOOL USED BY AN INDIVIDUAL SOLELY TO SUMMARIZE, ORGANIZE,
    TRANSLATE, DRAFT, ROUTE, OR PRESENT INFORMATION FOR HUMAN REVIEW OF ADMINISTRATIVE PROCESSING; OR (III) TECHNOLOGY
    THAT COMMUNICATES WITH CONSUMERS IN NATURAL LANGUAGE OR OTHER MEANS READILY UNDERSTOOD BY AN AVERAGE CONSUMER
    FOR THE PURPOSE OF PROVIDING CONSUMERS WITH INFORMATION, MAKING REFERRALS OR RECOMMENDATIONS, ANSWERING QUESTIONS,
    OR GENERATING OTHER CONTENT, IF: (A) THE TECHNOLOGY IS NOT CONTRACTED, ADVERTISED, MARKETED, CONFIGURED, OR
    INTENDED BY A PERSON TO BE USED IN A CONSEQUENTIAL DECISION; AND (B) THE TECHNOLOGY IS SUBJECT TO AN ACCEPTABLE
    USE POLICY THAT PROHIBITS GENERATED CONTENT TO BE USED IN A CONSEQUENTIAL DECISION.'
  summary: ADMT excludes listed routine technologies (security tools, calculators, databases, storage, networking,
    hosting, spell-checking, spam filtering, and spreadsheets that need human analysis and use no machine learning,
    foundation models or large language models), tools an individual uses solely to summarize, organize, translate,
    draft, route or present information for human review of administrative processing, and consumer chatbots that
    are not intended for consequential decisions and are under a use policy prohibiting it.
- id: co-6-1-1701-3-a
  citation: C.R.S. § 6-1-1701(3)(a)
  source: co-sb26-189-signed
  location: Signed act, p. 4
  effective_from: '2027-01-01'
  text: '(3) (a) "CONSEQUENTIAL DECISION" MEANS: (I) A DECISION, DETERMINATION, OR ACTION MADE ABOUT A CONSUMER
    THAT RELATES TO THE PROVISION OF OR A CONSUMER''S ACCESS TO, ELIGIBILITY FOR, SELECTION FOR, OR COMPENSATION
    FOR A COVERED DOMAIN; OR (II) A DECISION, DETERMINATION, OR ACTION ABOUT A CONSUMER THAT RELATES TO A DIFFERENTIATED
    PRICE, COST SHARING, COMPENSATION, OR OTHER MATERIAL TERMS IN A MANNER THAT IS REASONABLY LIKELY TO MATERIALLY
    LIMIT, DELAY, EFFECTIVELY DENY, OR OTHERWISE FUNDAMENTALLY ALTER THE CONSUMER''S ACCESS, ELIGIBILITY, OR OPPORTUNITY
    FOR A COVERED DOMAIN.'
  summary: A consequential decision is a decision, determination or action about a consumer that relates to the
    provision of, or the consumer's access to, eligibility for, selection for or compensation for, a covered domain,
    or to differentiated price or terms reasonably likely to materially limit, delay, deny or fundamentally alter
    access to one.
- id: co-6-1-1701-3-b
  citation: C.R.S. § 6-1-1701(3)(b)
  source: co-sb26-189-signed
  location: Signed act, pp. 4-5
  effective_from: '2027-01-01'
  text: '(b) "CONSEQUENTIAL DECISION" DOES NOT INCLUDE: (I) LOW-STAKES OR ROUTINE DECISIONS, ACTIONS, AND BUSINESS
    PROCESSES THAT DO NOT MATERIALLY INFLUENCE ELIGIBILITY FOR, SELECTION FOR, DENIAL OF, COMPENSATION FOR, PRICING
    OF, OR ACCESS TO AN OPPORTUNITY OR SERVICE FOR A COVERED DOMAIN, INCLUDING ROUTINE SCHEDULING, CLASSROOM PERSONALIZATION,
    ADMINISTRATIVE ROUTING, CUSTOMER SERVICE TRIAGE, COMMUNICATION OF DECISIONS, OR WORKFLOW MANAGEMENT; (II) ADVERTISING,
    MARKETING, DIFFERENTIATED PRODUCT RECOMMENDATIONS, SEARCH, OR CONTENT MODERATION; (III) SPREADSHEETS THAT REQUIRE
    MANUAL HUMAN ANALYSIS AND DO NOT USE MACHINE LEARNING, FOUNDATION MODELS, OR LARGE LANGUAGE MODELS; (IV) ACTIONS
    IN WHICH AN ADMT IS USED TO SUMMARIZE, ORGANIZE, OR PRESENT INFORMATION FOR HUMAN REVIEW AND THE SYSTEM DOES
    NOT PRODUCE A SCORE, RANKING, RECOMMENDATION, CLASSIFICATION, PREDICTION, OR OTHER INFERENCE THAT MATERIALLY
    INFLUENCES AN OUTCOME OR A DECISION; (V) NARROW PROCEDURAL TASKS OR DATA-PROCESSING FUNCTIONS THAT DO NOT GENERATE
    A PREDICTION OR INFERENCE ABOUT A CONSUMER OR MATERIALLY INFLUENCE A CONSEQUENTIAL DECISION OR CONSEQUENTIAL
    DECISION PROCESS; (VI) ACTIVITIES RELATING TO TECHNOLOGIES USED FOR CYBERSECURITY, SPAM- AND ROBO-CALL FILTERING,
    SYSTEM RELIABILITY, AND ANTI-MONEY LAUNDERING AND COUNTER-TERRORIST FINANCING CONTROLS; (VII) ACTIVITIES RELATING
    TO TECHNOLOGIES USED FOR ECONOMIC SANCTIONS COMPLIANCE, INCLUDING UNDER THE FEDERAL "BANK SECRECY ACT", 12 U.S.C.
    SEC. 1951 ET SEQ.; THE FEDERAL "USA PATRIOT ACT", PUB.L. 107-56; THE FEDERAL TRADE COMMISSION''S RED FLAGS RULE,
    16 CFR 681, AS AMENDED; AND SANCTIONS PROGRAMS ADMINISTERED BY THE UNITED STATES DEPARTMENT OF THE TREASURY,
    EXCLUDING FACIAL RECOGNITION UNLESS THE SOLE PURPOSE OF WHICH IS TO CONFIRM AN INDIVIDUAL''S IDENTITY; (VIII)
    ACTIVITIES RELATING TO TECHNOLOGIES USED FOR FRAUD PREVENTION, INCLUDING IDENTITY VERIFICATION, CONSUMER IDENTIFICATION,
    MONITORING, AND REPORTING CONTROLS REQUIRED UNDER STATE OR FEDERAL LAW; OR (IX) ROUTINE ACADEMIC ADMINISTRATION
    AND STUDENT SUPPORT PROCESSES THAT DO NOT MATERIALLY INFLUENCE A CONSEQUENTIAL DECISION.'
  summary: 'Excluded from consequential decisions: low-stakes or routine processes that do not materially influence
    access (scheduling, routing, triage, communicating decisions, workflow); advertising, marketing, product recommendations,
    search and content moderation; manual spreadsheets; summarizing or presenting information for human review with
    no score, ranking, recommendation, classification, prediction or other inference that materially influences
    the outcome; narrow procedural tasks; cybersecurity, fraud prevention, anti-money laundering and sanctions compliance;
    and routine academic administration.'
- id: co-6-1-1701-4
  citation: C.R.S. § 6-1-1701(4)
  source: co-sb26-189-signed
  location: Signed act, p. 5
  effective_from: '2027-01-01'
  text: (4) (a) "CONSUMER" HAS THE MEANING SET FORTH IN SECTION 6-1-1303 (6)(a). (b) "CONSUMER" INCLUDES AN EMPLOYEE,
    A JOB APPLICANT WHO IS A COLORADO RESIDENT, AND ANY INDIVIDUAL WHOSE ACCESS TO, ELIGIBILITY FOR, OR OPPORTUNITY
    IN COLORADO IS EVALUATED IN A CONSEQUENTIAL DECISION BY A PERSON DOING BUSINESS IN COLORADO.
  summary: A consumer has the Colorado Privacy Act meaning and also includes an employee, a job applicant who is
    a Colorado resident, and anyone whose access to, eligibility for or opportunity in Colorado is evaluated in
    a consequential decision by a person doing business in Colorado.
- id: co-6-1-1701-5
  citation: C.R.S. § 6-1-1701(5)
  source: co-sb26-189-signed
  location: Signed act, p. 5
  effective_from: '2027-01-01'
  text: (5) "COVERED ADMT" MEANS AUTOMATED DECISION-MAKING TECHNOLOGY THAT IS USED TO MATERIALLY INFLUENCE A CONSEQUENTIAL
    DECISION.
  summary: Covered ADMT is ADMT used to materially influence a consequential decision.
- id: co-6-1-1701-6
  citation: C.R.S. § 6-1-1701(6)
  source: co-sb26-189-signed
  location: Signed act, pp. 5-6
  effective_from: '2027-01-01'
  text: '(6) "COVERED DOMAIN" MEANS: (a) AN EDUCATION ENROLLMENT OR AN EDUCATION OPPORTUNITY; (b) EMPLOYMENT OR
    AN EMPLOYMENT OPPORTUNITY THAT CREATES OR MAY CREATE AN EMPLOYER-EMPLOYEE RELATIONSHIP; (c) THE LEASE OR PURCHASE
    OF RESIDENTIAL REAL ESTATE IN COLORADO; (d) A FINANCIAL OR LENDING SERVICE; (e) INSURANCE, INCLUDING UNDERWRITING,
    PRICING, COVERAGE, CLAIMS ADJUDICATION, OR OTHER DETERMINATIONS THAT MATERIALLY AFFECT ACCESS TO BENEFITS; (f)
    HEALTH-CARE SERVICES; OR (g) ESSENTIAL GOVERNMENT SERVICES AND PUBLIC BENEFITS, INCLUDING ELIGIBILITY AND RENEWAL
    DETERMINATIONS.'
  summary: The covered domains are education, employment, residential real estate in Colorado, financial or lending
    services, insurance, health-care services, and essential government services and public benefits.
- id: co-6-1-1701-7
  citation: C.R.S. § 6-1-1701(7)
  source: co-sb26-189-signed
  location: Signed act, p. 6
  effective_from: '2027-01-01'
  text: (7) "DEPLOYER" MEANS A PERSON DOING BUSINESS IN COLORADO THAT DEPLOYS A COVERED ADMT.
  summary: A deployer is a person doing business in Colorado that deploys a covered ADMT.
- id: co-6-1-1701-8
  citation: C.R.S. § 6-1-1701(8)
  source: co-sb26-189-signed
  location: Signed act, pp. 6-7
  effective_from: '2027-01-01'
  text: '(8) (a) "DEVELOPER" MEANS A PERSON DOING BUSINESS IN COLORADO THAT: (I) DEVELOPS, OFFERS, SELLS, LEASES,
    LICENSES, OR OTHERWISE MAKES COMMERCIALLY AVAILABLE A COVERED ADMT; (II) DEVELOPS A COMPONENT THAT IS DESIGNED,
    MARKETED, INTENDED, DOCUMENTED, ADVERTISED, CONFIGURED, OR CONTRACTED TO BE USED AS PART OF A COVERED ADMT;
    OR (III) INTENTIONALLY AND SUBSTANTIALLY MODIFIES AN ADMT SUCH THAT IT BECOMES A COVERED ADMT. (b) "DEVELOPER"
    DOES NOT INCLUDE A PERSON THAT: (I) DEVELOPS AND USES AN ADMT: (A) SOLELY FOR RESEARCH PURPOSES AND THE ADMT
    IS NOT USED IN A CONSEQUENTIAL DECISION IN THE RESEARCH; OR (B) FOR INTERNAL PURPOSES, SUCH AS USE AND DEVELOPMENT
    ACTIVITIES BY AFFILIATES AND COMMERCIAL SUPPORT FUNCTIONS, AND THAT DOES NOT MAKE THE SYSTEM AVAILABLE TO ANOTHER
    PERSON FOR USE IN A CONSEQUENTIAL DECISION; (II) IS A PRECEDING DEVELOPER THAT MAKES AN ADMT COMMERCIALLY AVAILABLE
    AND AN UNAFFILIATED PERSON MODIFIES THE COVERED ADMT IN A MANNER THAT CHANGES THE SYSTEM''S INTENDED, DOCUMENTED,
    MARKETED, ADVERTISED, CONFIGURED, OR CONTRACTED USE; OR (III) HAS DESIGNED, MARKETED, INTENDED, DOCUMENTED,
    ADVERTISED, CONFIGURED, OR CONTRACTED A COMPONENT THAT IS USED AS PART OF AN ADMT, BUT THE COMPONENT IS INTEGRATED
    INTO A COVERED ADMT WITHOUT THE ACTUAL KNOWLEDGE OF THE PERSON.'
  summary: A developer is a person doing business in Colorado that makes a covered ADMT commercially available,
    builds a component designed or contracted for one, or intentionally and substantially modifies an ADMT so it
    becomes covered. Research-only and internal-only development, a preceding developer whose system an unaffiliated
    person repurposes, and component makers without actual knowledge of the integration are excluded.
- id: co-6-1-1701-13
  citation: C.R.S. § 6-1-1701(13)
  source: co-sb26-189-signed
  location: Signed act, pp. 7-8
  effective_from: '2027-01-01'
  text: '(13) (a) "MATERIALLY INFLUENCE" MEANS: (I) AN ADMT OUTPUT IS A NON-DE MINIMIS FACTOR THAT IS USED IN MAKING
    A CONSEQUENTIAL DECISION; AND (II) AN ADMT OUTPUT AFFECTS THE OUTCOME OF A CONSEQUENTIAL DECISION, INCLUDING
    BY CONSTRAINING, RANKING, SCORING, RECOMMENDING, CLASSIFYING, OR OTHERWISE MEANINGFULLY ALTERING HOW A CONSEQUENTIAL
    DECISION IS MADE. (b) "MATERIALLY INFLUENCE" DOES NOT INCLUDE INCIDENTAL, TRIVIAL, OR CLERICAL USES.'
  summary: ADMT output materially influences a decision when it is a non-de minimis factor in making it and it affects
    the outcome, including by constraining, ranking, scoring, recommending or classifying. Incidental, trivial and
    clerical uses do not count.
- id: co-6-1-1701-15
  citation: C.R.S. § 6-1-1701(15)
  source: co-sb26-189-signed
  location: Signed act, pp. 8-9
  effective_from: '2027-01-01'
  text: '(15) "MEANINGFUL HUMAN REVIEW" MEANS REVIEW BY A INDIVIDUAL DESIGNATED BY THE DEPLOYER WHO HAS AUTHORITY
    TO APPROVE, MODIFY, OR OVERRIDE A CONSEQUENTIAL DECISION AND WHO: (a) CONSIDERS RELEVANT, AVAILABLE PRIMARY
    EVIDENCE; (b) IS TRAINED TO CONDUCT THE REVIEW; (c) DOES NOT DEFAULT TO THE SYSTEM OUTPUT; AND (d) HAS ACCESS
    TO SUFFICIENT INFORMATION TO UNDERSTAND: (I) THE OUTPUT''S: (A) INTENDED USE; (B) MATERIAL LIMITATIONS; AND
    (C) CATEGORIES OF INPUTS; AND (II) THE PRINCIPAL FACTORS USED TO GENERATE THE OUTPUT, WITHOUT REQUIRING DISCLOSURE
    OF PROPRIETARY SOURCE CODE, MODEL WEIGHTS, OR OTHER TRADE SECRETS.'
  summary: Meaningful human review is by an individual the deployer designates with authority to approve, modify
    or override the decision, who considers the relevant primary evidence, is trained, does not default to the system
    output, and can understand the output's intended use, limitations, inputs and principal factors.
- id: co-6-1-1703
  citation: C.R.S. § 6-1-1703
  source: co-sb26-189-signed
  location: Signed act, pp. 10-11
  effective_from: '2027-01-01'
  text: A DEPLOYER SHALL RETAIN, FOR NOT LESS THAN THREE YEARS AFTER THE DATE OF A CONSEQUENTIAL DECISION OR FOR
    A LONGER PERIOD IF REQUIRED BY APPLICABLE STATE OR FEDERAL LAW, RECORDS REASONABLY NECESSARY TO DEMONSTRATE
    COMPLIANCE WITH THIS PART 17. RECORDS MAY INCLUDE, AS APPLICABLE, COVERED ADMT VERSION IDENTIFIERS, CHANGELOGS,
    AND DOCUMENTATION OF MATERIAL MITIGATION CHANGES.
  summary: A deployer must keep records showing compliance for at least three years after each consequential decision,
    or longer if other law requires, such as version identifiers, changelogs and records of mitigation changes.
- id: co-6-1-1704-1-2
  citation: C.R.S. § 6-1-1704(1)-(2)
  source: co-sb26-189-signed
  location: Signed act, p. 11
  effective_from: '2027-01-01'
  text: (1) PRIOR TO A DEPLOYER USING A COVERED ADMT TO MATERIALLY INFLUENCE A CONSEQUENTIAL DECISION, THE DEPLOYER
    SHALL PROVIDE A CLEAR AND CONSPICUOUS NOTICE TO A CONSUMER THAT THE DEPLOYER USED OR WILL USE A COVERED ADMT
    IN A CONSEQUENTIAL DECISION AFFECTING THE CONSUMER AND INSTRUCTIONS REGARDING HOW THE CONSUMER MAY OBTAIN THE
    ADDITIONAL INFORMATION DESCRIBED IN THIS SECTION. (2) A DEPLOYER COMPLIES WITH SUBSECTION (1) OF THIS SECTION
    BY MAINTAINING A PROMINENT PUBLIC NOTICE THAT IS REASONABLY ACCESSIBLE AT POINTS OF CONSUMER INTERACTION, INCLUDING
    THROUGH A LINK OR POSTING THAT IS REASONABLY PROXIMATE TO THE INTERACTION OR TRANSACTION IN WHICH A CONSEQUENTIAL
    DECISION MAY OCCUR.
  summary: Before using covered ADMT to materially influence a consequential decision, a deployer must give consumers
    a clear and conspicuous notice and tell them how to get more information. A prominent public notice at or linked
    near the point of interaction satisfies this.
- id: co-6-1-1704-3
  citation: C.R.S. § 6-1-1704(3)
  source: co-sb26-189-signed
  location: Signed act, pp. 11-12
  effective_from: '2027-01-01'
  text: '(3) IF A DEPLOYER USES A COVERED ADMT TO MATERIALLY INFLUENCE A CONSEQUENTIAL DECISION THAT RESULTS IN
    AN ADVERSE OUTCOME FOR A CONSUMER, THE DEPLOYER SHALL PROVIDE WITHIN THIRTY DAYS AFTER MAKING THE DECISION:
    (a) A PLAIN LANGUAGE DESCRIPTION OF THE CONSEQUENTIAL DECISION AND THE ROLE THE COVERED ADMT PLAYED IN THE CONSEQUENTIAL
    DECISION; (b) INSTRUCTIONS AND A SIMPLE-TO-FOLLOW PROCESS TO REQUEST ADDITIONAL INFORMATION ABOUT THE COVERED
    ADMT AND THE INPUTS, INCLUDING THE NAME OF THE COVERED ADMT, THE COVERED ADMT VERSION NUMBER, IF APPLICABLE,
    THE COVERED ADMT DEVELOPER, AND THE TYPES, CATEGORIES, AND SOURCES OF PERSONAL DATA USED, TO THE EXTENT THE
    DEPLOYER RECEIVES THE NECESSARY INFORMATION FROM THE DEVELOPER IN COMPLIANCE WITH SECTION 6-1-1702; AND (c)
    AN EXPLANATION OF THE CONSUMER RIGHTS DESCRIBED IN SECTION 6-1-1705 AND HOW TO EXERCISE THEM.'
  summary: Within 30 days after a consequential decision with an adverse outcome, the deployer must give a plain-language
    description of the decision and the ADMT's role, a simple way to request more about the ADMT and the personal
    data used, and an explanation of the consumer's rights and how to use them.
- id: co-6-1-1704-8
  citation: C.R.S. § 6-1-1704(8)
  source: co-sb26-189-signed
  location: Signed act, p. 14
  effective_from: '2027-01-01'
  text: (8) A DEPLOYER OR DEVELOPER SHALL PROVIDE THE NOTICES AND DISCLOSURES REQUIRED BY THIS PART 17 IN A MANNER
    THAT IS REASONABLY ACCESSIBLE TO CONSUMERS WITH DISABILITIES AND CONSUMERS WITH LIMITED ENGLISH PROFICIENCY,
    CONSISTENT WITH APPLICABLE STATE AND FEDERAL LAW.
  summary: Notices and disclosures must be reasonably accessible to consumers with disabilities and with limited
    English proficiency.
- id: co-6-1-1705-1
  citation: C.R.S. § 6-1-1705(1)
  source: co-sb26-189-signed
  location: Signed act, pp. 14-15
  effective_from: '2027-01-01'
  text: '(1) (a) WHEN A CONSUMER EXPERIENCES AN ADVERSE OUTCOME RESULTING FROM A CONSEQUENTIAL DECISION IN WHICH
    A COVERED ADMT MATERIALLY INFLUENCES THE CONSEQUENTIAL DECISION, THE CONSUMER MAY REQUEST AND THE DEPLOYER SHALL
    PROVIDE IN RESPONSE TO THE REQUEST: (I) INSTRUCTIONS FOR REQUESTING PERSONAL DATA AND CORRECTING FACTUALLY INCORRECT
    OR MATERIALLY INACCURATE PERSONAL DATA USED IN A CONSEQUENTIAL DECISION THAT USED A COVERED ADMT CONSISTENT
    WITH SECTION 6-1-1306; AND (II) AN OPPORTUNITY FOR MEANINGFUL HUMAN REVIEW AND RECONSIDERATION OF THE CONSEQUENTIAL
    DECISION, TO THE EXTENT COMMERCIALLY REASONABLE. (b) FOR THE PURPOSES OF THIS SUBSECTION (1), THE EXCEPTIONS
    TO THE DEFINITION OF "CONSUMER" IN SECTION 6-1-1303 (6)(b) AND THE EXCEPTIONS IN SECTION 6-1-1304 (2)(k), (2)(n),
    AND (2)(o) DO NOT APPLY TO THE RIGHT TO REQUEST CORRECTION OF FACTUALLY INCORRECT OR MATERIALLY INACCURATE PERSONAL
    DATA PURSUANT TO THIS SUBSECTION (1). (c) SUBSECTION (1)(a) OF THIS SECTION DOES NOT REQUIRE CORRECTION OF OPINIONS,
    PREDICTIONS, SCORES, OR PROTECTED EVALUATIONS.'
  summary: After an adverse outcome, a consumer may ask for instructions to get and correct inaccurate personal
    data used in the decision, and for meaningful human review and reconsideration to the extent commercially reasonable.
    Opinions, predictions, scores and protected evaluations need not be corrected.
- id: co-6-1-1708-1-2
  citation: C.R.S. § 6-1-1708(1)-(2)
  source: co-sb26-189-signed
  location: Signed act, p. 20
  effective_from: '2027-01-01'
  text: (1) (a) AN INSURER, AS DEFINED IN SECTION 10-1-102 (13), AND AFFILIATED ENTITIES THAT ARE SUBJECT TO THE
    REQUIREMENTS OF SECTION 10-3-1104.9 ARE IN COMPLIANCE WITH THIS PART 17 IN THE PRACTICE OF INSURANCE. (b) IF
    AN INSURER IS NOT DEEMED IN COMPLIANCE PURSUANT TO SUBSECTION (1)(a) OF THIS SECTION, THE INSURER SHALL PROVIDE
    NOTICE AND DISCLOSURE OF ITS USE OF A COVERED ADMT IN MATERIALLY INFLUENCING A CONSEQUENTIAL DECISION REGARDING
    THE PRACTICE OF INSURANCE PURSUANT TO THE DISCLOSURE REQUIREMENTS OF SECTION 6-1-1704 (3), TO THE EXTENT APPLICABLE.
    (2) THIS SECTION DOES NOT LIMIT THE APPLICABILITY OF THIS PART 17 TO USES OF COVERED ADMT RELATED TO INSURER
    EMPLOYMENT OR INSURER EMPLOYMENT OPPORTUNITIES BY INSURERS AND AFFILIATED ENTITIES THAT ARE SUBJECT TO THE REQUIREMENTS
    OF SECTION 10-3-1104.9.
  summary: Insurers and affiliates subject to section 10-3-1104.9 comply with part 17 in the practice of insurance;
    other insurers must still give the post-adverse outcome disclosures. Insurers' own employment decisions stay
    covered.
- id: co-6-1-1708-3-a-b
  citation: C.R.S. § 6-1-1708(3)(a)-(b)
  source: co-sb26-189-signed
  location: Signed act, pp. 20-21
  effective_from: '2027-01-01'
  text: (3) (a) SECTIONS 6-1-1701, 6-1-1702, 6-1-1703, 6-1-1704, 6-1-1705, AND 6-1-1706 DO NOT APPLY TO A COVERED
    ENTITY WITHIN THE MEANING OF THE FEDERAL "HEALTH INSURANCE PORTABILITY AND ACCOUNTABILITY ACT OF 1996", 42 U.S.C.
    SECS. 1320d TO 1320d-9, AND THE REGULATIONS PROMULGATED UNDER THE FEDERAL ACT, OR A COVERED ENTITY'S BUSINESS
    ASSOCIATES FOR ANY SERVICES RENDERED TO A COVERED ENTITY, TO THE EXTENT THE COVERED ENTITY IS DOING BUSINESS
    IN COLORADO, EXCEPT FOR A CONSEQUENTIAL DECISION RELATED TO EMPLOYMENT OR AN EMPLOYMENT OPPORTUNITY. (b) NOTWITHSTANDING
    SUBSECTION (3)(a) OF THIS SECTION, FOR A COVERED ENTITY THAT IS A HEALTH-CARE PROVIDER, AS DEFINED IN 45 CFR
    160.103, THIS SUBSECTION (3) APPLIES ONLY IF THE HEALTH-CARE PROVIDER IS OPERATING FROM A LOCATION WITHIN COLORADO.
  summary: Sections 6-1-1701 to 6-1-1706 do not apply to HIPAA covered entities doing business in Colorado or their
    business associates, except for employment decisions. A health-care provider is exempt only if it operates from
    a location in Colorado. Paragraphs (c) and (d), which still apply, are not in this pack.
- id: co-sb26-189-s5
  citation: Colo. SB 26-189, § 5
  source: co-sb26-189-signed
  location: Signed act, pp. 23-24
  effective_from: '2026-05-14'
  text: SECTION 5. Effective date - applicability. (1) Except as otherwise provided in subsection (2) of this section,
    this act takes effect January 1, 2027. (2) Sections 6-1-1704 (4), 6-1-1705 (3), and 6-1-1706 (6), Colorado Revised
    Statutes, as amended in section 1 of this act, section 10-3-1104.9 (3)(e), Colorado Revised Statutes, as enacted
    in section 3 of this act, section 4 of this act, this section, and section 6 of this act take effect upon passage.
    (3) This act applies to consequential decisions made on or after January 1, 2027.
  summary: The act takes effect January 1, 2027, and applies to consequential decisions made on or after that date.
    The rulemaking deadlines and appropriation took effect on passage.
facts:
- id: co.scope.doing_business
  question: Does the organization do business in Colorado?
  type: boolean
  asked_in: scoping
  defined_by:
  - co-6-1-1701-7
  - co-6-1-1701-8
- id: co.role.deploys
  question: Does the organization deploy the technology?
  type: boolean
  defined_by:
  - co-6-1-1701-7
  help: The act does not define "deploy". Answer yes if the organization itself puts the technology into use, rather
    than only developing or selling it. Whether it is a covered ADMT, and whether the organization does business
    in Colorado, are decided from other answers.
- id: co.tech.generates_output
  question: Does the technology process personal data and use computation to generate output, such as predictions,
    recommendations, classifications, rankings or scores, that is used to make, guide or assist a decision, judgment
    or determination about an individual?
  type: boolean
  defined_by:
  - co-6-1-1701-2-a
- id: co.tech.excluded
  question: Is the technology one of the tools the act excludes?
  type: boolean
  defined_by:
  - co-6-1-1701-2-b
  help: 'Answer yes if it is one of these:

    - A routine tool: anti-malware, anti-virus, calculators, databases, data storage, firewalls, internet domain
    registration, website loading, networking, spam and robocall filtering, spell-checking, web caching or web hosting

    - A spreadsheet that needs human analysis and uses no machine learning, foundation models or large language
    models

    - A tool a person uses solely to summarize, organize, translate, draft, route or present information for human
    review of administrative processing

    - A technology that communicates with consumers, is not contracted, marketed, configured or intended for consequential
    decisions, and is under a use policy that prohibits using its content in them'
- id: co.decision.domain
  question: Which area is the decision in?
  type: choice
  options:
  - value: education
    label: Education enrollment or an education opportunity
  - value: employment
    label: Employment or an employment opportunity that creates or may create an employer-employee relationship
  - value: housing
    label: The lease or purchase of residential real estate in Colorado
  - value: financial
    label: A financial or lending service
  - value: insurance
    label: Insurance, including underwriting, pricing, coverage, claims adjudication or other determinations that
      materially affect access to benefits
  - value: healthcare
    label: Health-care services
  - value: government
    label: Essential government services and public benefits, including eligibility and renewal determinations
  - value: other
    label: None of these
  defined_by:
  - co-6-1-1701-6
- id: co.decision.affects_access
  question: Is the decision, determination or action about a person, and does it relate to the provision of, or
    their access to, eligibility for, selection for or compensation for, that opportunity or service, or to a differentiated
    price, cost sharing, compensation or other material terms in a way reasonably likely to materially limit, delay,
    effectively deny or otherwise fundamentally alter their access, eligibility or opportunity?
  type: boolean
  defined_by:
  - co-6-1-1701-3-a
- id: co.decision.excluded
  question: Is this use one the act excludes from consequential decisions?
  type: boolean
  defined_by:
  - co-6-1-1701-3-b
  help: 'Answer yes if it is one of these:

    - A low-stakes or routine process that does not materially influence eligibility, selection, denial, compensation,
    pricing or access, such as scheduling, classroom personalization, administrative routing, customer service triage,
    communicating decisions or workflow management

    - Advertising, marketing, differentiated product recommendations, search or content moderation

    - A spreadsheet that needs manual human analysis and uses no machine learning, foundation models or large language
    models

    - Summarizing, organizing or presenting information for human review, where the system produces no score, ranking,
    recommendation, classification, prediction or other inference that materially influences the outcome

    - A narrow procedural or data-processing task that generates no prediction or inference about a person and does
    not materially influence the decision

    - Cybersecurity, spam and robocall filtering, system reliability, anti-money laundering or counter-terrorist
    financing controls

    - Economic sanctions compliance, or fraud prevention such as identity verification and legally required monitoring

    - Routine academic administration and student support that does not materially influence a consequential decision'
- id: co.influence.non_de_minimis
  question: Is the technology's output a non-de minimis factor used in making the decision?
  type: boolean
  defined_by:
  - co-6-1-1701-13
- id: co.influence.affects_outcome
  question: Does the output affect the outcome of the decision, including by constraining, ranking, scoring, recommending
    or classifying, or otherwise meaningfully altering how the decision is made?
  type: boolean
  defined_by:
  - co-6-1-1701-13
- id: co.influence.incidental_only
  question: Is the use of the output only incidental, trivial or clerical?
  type: boolean
  defined_by:
  - co-6-1-1701-13
- id: co.subjects.colorado_consumers
  question: Does the decision concern Colorado consumers, such as Colorado residents, employees, job applicants
    who are Colorado residents, or anyone whose access to, eligibility for or opportunity in Colorado is evaluated
    by an organization doing business in Colorado?
  type: boolean
  defined_by:
  - co-6-1-1701-4
  help: Paragraph (4)(a) adopts the Colorado Privacy Act definition in section 6-1-1303(6)(a), which is not in a
    pack yet. Paragraph (4)(b) is enough on its own for employees and Colorado-resident applicants; an analyst confirms
    any other case.
- id: co.decision.adverse_possible
  question: Can the decision result in an adverse outcome for a person, such as denying, terminating or materially
    reducing their access to or selection for the opportunity or service, or giving them materially less favorable
    price, compensation or terms than similarly situated people?
  type: boolean
  defined_by:
  - co-6-1-1701-1
- id: co.exempt.hipaa_covered_entity
  question: Is the organization a HIPAA covered entity doing business in Colorado, or a business associate providing
    services to one? A covered entity that is a health-care provider counts only if it operates from a location
    in Colorado.
  type: boolean
  defined_by:
  - co-6-1-1708-3-a-b
- id: co.exempt.insurer
  question: Is the organization an insurer, or an affiliated entity, subject to the requirements of section 10-3-1104.9?
  type: boolean
  defined_by:
  - co-6-1-1708-1-2
rules:
- id: CO-CLASS-ADMT
  kind: classification
  title: The technology is ADMT under Colorado law
  provisions:
  - co-6-1-1701-2-a
  - co-6-1-1701-2-b
  when:
    all:
    - fact: co.tech.generates_output
      equals: true
    - not:
        fact: co.tech.excluded
        equals: true
  result:
    set_fact: co.admt
    value: true
  explanation: The technology processes personal data and computes output used to make, guide or assist a decision
    about an individual, and it is not one of the excluded tools.
- id: CO-CLASS-CONSEQUENTIAL
  kind: classification
  title: The decision is a consequential decision under Colorado law
  provisions:
  - co-6-1-1701-3-a
  - co-6-1-1701-3-b
  - co-6-1-1701-6
  when:
    all:
    - fact: co.decision.domain
      in:
      - education
      - employment
      - housing
      - financial
      - insurance
      - healthcare
      - government
    - fact: co.decision.affects_access
      equals: true
    - not:
        fact: co.decision.excluded
        equals: true
  result:
    set_fact: co.consequential_decision
    value: true
  explanation: The decision is in a covered domain, relates to a person's access to, eligibility for, selection
    for or compensation for it, and is not one of the excluded uses.
- id: CO-CLASS-MATERIAL-INFLUENCE
  kind: classification
  title: The output materially influences the decision
  provisions:
  - co-6-1-1701-13
  when:
    all:
    - fact: co.influence.non_de_minimis
      equals: true
    - fact: co.influence.affects_outcome
      equals: true
    - not:
        fact: co.influence.incidental_only
        equals: true
  result:
    set_fact: co.materially_influences
    value: true
  explanation: The output is a non-de minimis factor in the decision and affects its outcome, and the use is not
    merely incidental, trivial or clerical.
- id: CO-CLASS-COVERED-ADMT
  kind: classification
  title: The technology is covered ADMT
  provisions:
  - co-6-1-1701-5
  when:
    all:
    - fact: co.admt
      equals: true
    - fact: co.consequential_decision
      equals: true
    - fact: co.materially_influences
      equals: true
  result:
    set_fact: co.covered_admt
    value: true
  explanation: The technology is ADMT and is used to materially influence a consequential decision.
- id: CO-CLASS-EXEMPT-HIPAA
  kind: classification
  title: HIPAA covered entity exemption applies
  provisions:
  - co-6-1-1708-3-a-b
  when:
    all:
    - fact: co.exempt.hipaa_covered_entity
      equals: true
    - not:
        fact: co.decision.domain
        equals: employment
  result:
    set_fact: co.exempt
    value: true
  explanation: Sections 6-1-1701 to 6-1-1706 do not apply to a HIPAA covered entity or its business associate, except
    for employment decisions. Section 6-1-1708(3)(c) and (d) still require a general patient notice and, for financial
    assistance eligibility, specific disclosures; those are not modeled here and an analyst must check them.
- id: CO-CLASS-EXEMPT-INSURER
  kind: classification
  title: Insurer deemed in compliance in the practice of insurance
  provisions:
  - co-6-1-1708-1-2
  when:
    all:
    - fact: co.exempt.insurer
      equals: true
    - fact: co.decision.domain
      equals: insurance
  result:
    set_fact: co.exempt
    value: true
  explanation: An insurer or affiliate subject to section 10-3-1104.9 is in compliance with part 17 in the practice
    of insurance. Its employment decisions remain covered.
- id: CO-DEPLOYER-NOTICE
  kind: obligation
  title: Give consumers notice before using covered ADMT
  provisions:
  - co-6-1-1704-1-2
  - co-6-1-1704-8
  - co-6-1-1701-7
  - co-sb26-189-s5
  when:
    all:
    - fact: co.scope.doing_business
      equals: true
    - fact: co.role.deploys
      equals: true
    - fact: co.covered_admt
      equals: true
    - fact: co.subjects.colorado_consumers
      equals: true
    - not:
        fact: co.exempt
        equals: true
  result:
    obligation: co_point_of_interaction_notice
    applies_from: '2027-01-01'
  explanation: Before covered ADMT materially influences a consequential decision, the deployer must give a clear
    and conspicuous notice and say how to get more information. A prominent public notice at or near the point of
    interaction satisfies this. Notices must be accessible to people with disabilities and limited English proficiency.
- id: CO-DEPLOYER-ADVERSE-OUTCOME
  kind: obligation
  title: Give post-adverse outcome disclosures within 30 days
  provisions:
  - co-6-1-1704-3
  - co-6-1-1704-8
  - co-sb26-189-s5
  when:
    all:
    - fact: co.scope.doing_business
      equals: true
    - fact: co.role.deploys
      equals: true
    - fact: co.covered_admt
      equals: true
    - fact: co.subjects.colorado_consumers
      equals: true
    - fact: co.decision.adverse_possible
      equals: true
    - not:
        fact: co.exempt
        equals: true
  result:
    obligation: co_post_adverse_outcome_disclosure
    applies_from: '2027-01-01'
    within_days: 30
  explanation: When a decision materially influenced by covered ADMT has an adverse outcome, the deployer must,
    within 30 days, describe the decision and the ADMT's role, explain how to request more about the ADMT and the
    personal data used, and explain the consumer's rights. The Attorney General must adopt rules on these disclosures
    by January 1, 2027.
- id: CO-CONSUMER-RIGHTS
  kind: obligation
  title: Offer correction and meaningful human review after an adverse outcome
  provisions:
  - co-6-1-1705-1
  - co-6-1-1701-15
  - co-sb26-189-s5
  when:
    all:
    - fact: co.scope.doing_business
      equals: true
    - fact: co.role.deploys
      equals: true
    - fact: co.covered_admt
      equals: true
    - fact: co.subjects.colorado_consumers
      equals: true
    - fact: co.decision.adverse_possible
      equals: true
    - not:
        fact: co.exempt
        equals: true
  result:
    obligation: co_correction_and_human_review
    applies_from: '2027-01-01'
  explanation: After an adverse outcome, a consumer may ask for instructions to correct inaccurate personal data
    used in the decision and for meaningful human review and reconsideration, to the extent commercially reasonable.
    The reviewer must have authority to change the decision, be trained, weigh primary evidence and not default
    to the output.
- id: CO-DEPLOYER-RECORDS
  kind: obligation
  title: Keep compliance records for three years after each decision
  provisions:
  - co-6-1-1703
  - co-sb26-189-s5
  when:
    all:
    - fact: co.scope.doing_business
      equals: true
    - fact: co.role.deploys
      equals: true
    - fact: co.covered_admt
      equals: true
    - fact: co.subjects.colorado_consumers
      equals: true
    - not:
        fact: co.exempt
        equals: true
  result:
    obligation: co_deployer_records
    applies_from: '2027-01-01'
    retain_years: 3
  explanation: The deployer must keep records showing compliance for at least three years after each consequential
    decision, such as ADMT version identifiers, changelogs and records of mitigation changes.
